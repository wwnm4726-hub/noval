<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${mode == 'edit'} ? '编辑小说 - 运营后台' : '新增小说 - 运营后台'">小说表单</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f5f5f5; margin: 0; color: #333; }
        .navbar { background: #2c3e50; color: #fff; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
        .navbar a { color: #fff; text-decoration: none; margin: 0 8px; }
        .nav-left .brand { font-size: 18px; font-weight: bold; margin-right: 20px; }
        .btn-link, button.btn-link { background: none; border: none; color: #fff; cursor: pointer; font-size: 14px; }
        .container { max-width: 680px; margin: 24px auto; padding: 0 16px; }

        .card { background: #fff; border-radius: 8px; padding: 24px; box-shadow: 0 2px 6px rgba(0,0,0,.06); }
        .card h1 { margin: 0 0 20px; font-size: 20px; color: #2c3e50; }
        label { display: block; margin-top: 14px; font-weight: bold; font-size: 14px; }
        input[type=text], textarea, select { width: 100%; padding: 9px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; font-size: 14px; }
        textarea { min-height: 100px; resize: vertical; }
        .btns { margin-top: 22px; display: flex; gap: 10px; }
        .btn { padding: 9px 20px; border-radius: 4px; border: none; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-block; }
        .btn-primary { background: #27ae60; color: #fff; }
        .btn-primary:hover { background: #1e8449; }
        .btn-outline { background: #fff; color: #34495e; border: 1px solid #bdc3c7; }
        .btn-outline:hover { background: #ecf0f1; }
        .flash { padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; font-size: 14px; background: #fde2e2; color: #c0392b; }
    </style>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <div class="card">
        <h1 th:text="${mode == 'edit'} ? '✏️ 编辑小说' : '＋ 新增小说'">小说</h1>

        <div class="flash" th:if="${error}" th:text="${error}">错误</div>

        <form th:action="${mode == 'edit'} ? @{/admin/novels/{id}(id=${novel.id})} : @{/admin/novels}" method="post">
            <label for="title">书名 *</label>
            <input type="text" id="title" name="title" required maxlength="200"
                   th:value="${novel != null} ? ${novel.title} : ''">

            <label for="author">作者 *</label>
            <input type="text" id="author" name="author" required maxlength="100"
                   th:value="${novel != null} ? ${novel.author} : ''">

            <label for="category">分类</label>
            <input type="text" id="category" name="category" maxlength="50" placeholder="如: 玄幻 / 都市 / 修真"
                   th:value="${novel != null} ? ${novel.category} : ''">

            <label for="tags">标签</label>
            <input type="text" id="tags" name="tags" maxlength="255" placeholder="多个标签用逗号分隔,如: 热血,升级,爽文"
                   th:value="${novel != null} ? ${novel.tags} : ''">

            <label for="status">状态</label>
            <select id="status" name="status">
                <option value="连载中" th:selected="${novel == null or novel.status == '连载中'}">连载中</option>
                <option value="已完结" th:selected="${novel != null and novel.status == '已完结'}">已完结</option>
            </select>

            <label for="cover">封面图片 URL</label>
            <input type="text" id="cover" name="cover" maxlength="500" placeholder="https://..."
                   th:value="${novel != null} ? ${novel.cover} : ''">

            <label for="description">简介</label>
            <textarea id="description" name="description"
                      th:text="${novel != null} ? ${novel.description} : ''"></textarea>

            <div class="btns">
                <button type="submit" class="btn btn-primary">保存</button>
                <a th:href="@{/admin/novels}" class="btn btn-outline">取消</a>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
