<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>用户管理 - 运营后台</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f5f5f5; margin: 0; color: #333; }
        .navbar { background: #2c3e50; color: #fff; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
        .navbar a { color: #fff; text-decoration: none; margin: 0 8px; }
        .nav-left .brand { font-size: 18px; font-weight: bold; margin-right: 20px; }
        .btn-link, button.btn-link { background: none; border: none; color: #fff; cursor: pointer; font-size: 14px; }
        .container { max-width: 1100px; margin: 24px auto; padding: 0 16px; }

        .header-bar { background: #fff; padding: 20px 24px; border-radius: 8px; margin-bottom: 16px;
                      box-shadow: 0 2px 6px rgba(0,0,0,.06); display: flex; justify-content: space-between; align-items: center; }
        .header-bar h1 { margin: 0; font-size: 22px; color: #2c3e50; }
        .admin-nav a { color: #3498db; text-decoration: none; margin-left: 14px; font-size: 14px; }
        .admin-nav a:hover { text-decoration: underline; }

        .btn { padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; font-size: 13px; text-decoration: none; display: inline-block; }
        .btn-sm { padding: 5px 10px; font-size: 13px; }
        .btn-edit { background: #3498db; color: #fff; }
        .btn-edit:hover { background: #2980b9; }
        .btn-del { background: #e74c3c; color: #fff; }
        .btn-del:hover { background: #c0392b; }

        .flash { padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
        .flash.ok { background: #dff5e1; color: #1e8449; }
        .flash.err { background: #fde2e2; color: #c0392b; }

        table { width: 100%; background: #fff; border-collapse: collapse; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,.06); }
        th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #ecf0f1; font-size: 14px; }
        th { background: #34495e; color: #fff; font-weight: normal; }
        tr:last-child td { border-bottom: none; }
        td.name { font-weight: bold; color: #2c3e50; }
        .role-tag { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; }
        .role-ADMIN { background: #e67e22; color: #fff; }
        .role-USER { background: #ecf0f1; color: #34495e; }
        .me-tag { color: #7f8c8d; font-size: 12px; margin-left: 6px; }
        .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .actions form { display: flex; gap: 6px; align-items: center; }
        select { padding: 5px 8px; border: 1px solid #bdc3c7; border-radius: 4px; font-size: 13px; }
        .empty { background: #fff; padding: 40px; text-align: center; color: #7f8c8d; border-radius: 8px; }
        .footer { text-align: center; padding: 24px; color: #95a5a6; font-size: 13px; margin-top: 40px; }
    </style>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <div class="header-bar">
        <h1>👥 用户管理</h1>
        <span class="admin-nav">
            <a th:href="@{/admin/novels}">小说管理</a>
            <a th:href="@{/admin/dashboard}">数据概览</a>
        </span>
    </div>

    <div class="flash ok" th:if="${message}" th:text="${message}">ok</div>
    <div class="flash err" th:if="${error}" th:text="${error}">err</div>

    <table th:if="${!#lists.isEmpty(users)}">
        <thead>
        <tr>
            <th>ID</th>
            <th>用户名</th>
            <th>昵称</th>
            <th>角色</th>
            <th>注册时间</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.id}">1</td>
            <td class="name">
                <span th:text="${u.username}">用户名</span>
                <span class="me-tag" th:if="${currentUserId != null and currentUserId == u.id}">(我)</span>
            </td>
            <td th:text="${u.nickname != null and u.nickname != ''} ? ${u.nickname} : '—'">—</td>
            <td>
                <span class="role-tag" th:classappend="'role-' + ${u.role}" th:text="${u.role}">角色</span>
            </td>
            <td th:if="${u.createdAt != null}"
                th:text="${#temporals.format(u.createdAt, 'yyyy-MM-dd HH:mm')}">时间</td>
            <td th:unless="${u.createdAt != null}">—</td>
            <td>
                <div class="actions" th:if="${currentUserId == null or currentUserId != u.id}">
                    <!-- 角色调整 -->
                    <form th:action="@{/admin/users/{id}/role(id=${u.id})}" method="post">
                        <select name="role">
                            <option value="USER" th:selected="${u.role == 'USER'}">USER</option>
                            <option value="ADMIN" th:selected="${u.role == 'ADMIN'}">ADMIN</option>
                        </select>
                        <button type="submit" class="btn btn-sm btn-edit">调整角色</button>
                    </form>
                    <!-- 删除 -->
                    <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post"
                          onsubmit="return confirm('确认删除用户「' + '${u.username}' + '」及其评论/评分/书架等数据?此操作不可恢复。')">
                        <button type="submit" class="btn btn-sm btn-del">删除</button>
                    </form>
                </div>
                <span class="me-tag" th:if="${currentUserId != null and currentUserId == u.id}">不可操作自己</span>
            </td>
        </tr>
        </tbody>
    </table>
    <div class="empty" th:if="${#lists.isEmpty(users)}">暂无用户。</div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
