<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${status} + ' · 出错了'">出错了 - 小说阅读平台</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f5f5f5; margin: 0; color: #333; }
        .navbar { background: #2c3e50; color: #fff; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
        .navbar a { color: #fff; text-decoration: none; margin-left: 12px; }
        .wrap { max-width: 560px; margin: 80px auto; padding: 0 16px; text-align: center; }
        .card { background: #fff; border-radius: 10px; padding: 48px 32px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
        .code { font-size: 72px; font-weight: bold; color: #e74c3c; line-height: 1; margin-bottom: 12px; }
        .title { font-size: 22px; color: #2c3e50; margin-bottom: 12px; }
        .msg { color: #7f8c8d; font-size: 15px; line-height: 1.7; margin-bottom: 8px; }
        .path { color: #bdc3c7; font-size: 13px; word-break: break-all; margin-bottom: 24px; }
        .btns { display: flex; gap: 12px; justify-content: center; }
        .btn { padding: 10px 22px; border-radius: 5px; text-decoration: none; font-size: 14px; }
        .btn-home { background: #2c3e50; color: #fff; }
        .btn-home:hover { background: #1a252f; }
        .btn-back { background: #ecf0f1; color: #34495e; }
        .btn-back:hover { background: #dde1e3; }
    </style>
</head>
<body>
<div class="navbar">
    <div><a th:href="@{/}">📚 小说阅读平台</a></div>
    <div>
        <a th:href="@{/}">首页</a>
        <a th:href="@{/bookshelf}">我的书架</a>
    </div>
</div>

<div class="wrap">
    <div class="card">
        <div class="code" th:text="${status} ?: '500'">500</div>
        <div class="title" th:text="${error} ?: '服务器出错了'">出错了</div>
        <div class="msg" th:text="${message} ?: '你访问的页面出了点问题,请稍后再试。'">错误信息</div>
        <div class="path" th:if="${path}">
            请求路径: <span th:text="${path}">/</span>
        </div>
        <div class="btns">
            <a th:href="@{/}" class="btn btn-home">返回首页</a>
            <a href="javascript:history.back()" class="btn btn-back">返回上一页</a>
        </div>
    </div>
</div>
</body>
</html>
