<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${author + ' - 作者主页'}">作者主页</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f5f5f5; margin: 0; color: #333; }
        .navbar { background: #2c3e50; color: #fff; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
        .navbar a { color: #fff; text-decoration: none; margin: 0 8px; }
        .nav-left .brand { font-size: 18px; font-weight: bold; margin-right: 20px; }
        .btn-link, button.btn-link { background: none; border: none; color: #fff; cursor: pointer; font-size: 14px; }
        .container { max-width: 1200px; margin: 24px auto; padding: 0 16px; }

        .header-bar { background: #fff; padding: 22px 24px; border-radius: 8px; margin-bottom: 20px;
                      box-shadow: 0 2px 6px rgba(0,0,0,.06); }
        .header-bar h1 { margin: 0 0 6px; font-size: 24px; color: #2c3e50; }
        .header-bar .count { color: #7f8c8d; font-size: 14px; }
        .header-bar a { color: #2980b9; text-decoration: none; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,.08); display: flex; flex-direction: column; }
        .card a { color: inherit; text-decoration: none; }
        .card-cover { width: 100%; height: 280px; object-fit: cover; background: #ecf0f1; display: block; }
        .card-body { padding: 14px; flex: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 16px; font-weight: bold; margin: 0 0 4px; color: #2c3e50; }
        .card-meta { font-size: 12px; color: #7f8c8d; margin-bottom: 8px; }
        .card-desc { font-size: 13px; color: #555; line-height: 1.5; flex: 1; overflow: hidden;
                     display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
        .tag-cat { background: #ecf0f1; color: #34495e; }
        .tag-status { background: #27ae60; color: #fff; }
        .tag-status.done { background: #95a5a6; }

        .empty { background: #fff; padding: 50px; text-align: center; color: #7f8c8d; border-radius: 8px; }
        .footer { text-align: center; padding: 24px; color: #95a5a6; font-size: 13px; margin-top: 40px; }
    </style>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <div class="header-bar">
        <h1>✍️ <span th:text="${author}">作者</span></h1>
        <div class="count">
            共 <strong th:text="${novelCount}">0</strong> 部作品 ·
            <a th:href="@{/}">← 返回首页</a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(novels)}" class="empty">
        该作者暂无作品。
    </div>

    <div class="grid" th:if="${!#lists.isEmpty(novels)}">
        <div class="card" th:each="n : ${novels}">
            <a th:href="@{/novels/{id}(id=${n.id})}">
                <img class="card-cover"
                     th:src="${n.cover != null and n.cover != ''} ? ${n.cover} : 'https://placehold.co/200x280/95a5a6/ffffff?text=No+Cover'"
                     th:alt="${n.title}">
                <div class="card-body">
                    <div class="card-title" th:text="${n.title}">书名</div>
                    <div class="card-meta">
                        <span th:text="'共 ' + ${chapterCounts[n.id]} + ' 章'">共 0 章</span> ·
                        <span th:text="'👁 ' + ${n.viewCount}">👁 0</span>
                    </div>
                    <div class="card-desc" th:text="${n.description}">简介</div>
                    <div style="margin-top:10px;display:flex;gap:6px;align-items:center">
                        <span class="tag tag-cat" th:text="${n.category}">分类</span>
                        <span class="tag tag-status"
                              th:classappend="${n.status == '已完结'} ? 'done' : ''"
                              th:text="${n.status}">状态</span>
                    </div>
                </div>
            </a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
