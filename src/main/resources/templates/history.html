<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>阅读历史 - 小说阅读平台</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f5f5f5; margin: 0; color: #333; }
        .navbar { background: #2c3e50; color: #fff; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
        .navbar a { color: #fff; text-decoration: none; margin: 0 8px; }
        .nav-left .brand { font-size: 18px; font-weight: bold; margin-right: 20px; }
        .btn-link, button.btn-link { background: none; border: none; color: #fff; cursor: pointer; font-size: 14px; }
        .container { max-width: 900px; margin: 24px auto; padding: 0 16px; }

        .header-bar { background: #fff; padding: 20px 24px; border-radius: 8px; margin-bottom: 20px;
                      box-shadow: 0 2px 6px rgba(0,0,0,.06); display: flex; justify-content: space-between; align-items: center; }
        .header-bar h1 { margin: 0; font-size: 22px; color: #2c3e50; }
        .header-bar .count { color: #7f8c8d; font-size: 14px; margin-left: 8px; }

        .list { background: #fff; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.06); overflow: hidden; }
        .item { display: flex; gap: 16px; padding: 16px 20px; border-bottom: 1px solid #ecf0f1; align-items: center; }
        .item:last-child { border-bottom: none; }
        .item-cover { width: 56px; height: 76px; object-fit: cover; border-radius: 4px; background: #ecf0f1; flex-shrink: 0; }
        .item-main { flex: 1; min-width: 0; }
        .item-title { font-size: 16px; font-weight: bold; color: #2c3e50; margin: 0 0 6px; }
        .item-title a { color: inherit; text-decoration: none; }
        .item-title a:hover { color: #e74c3c; }
        .item-meta { font-size: 13px; color: #7f8c8d; }
        .item-meta .chapter { color: #b9770e; font-weight: bold; }
        .item-time { font-size: 12px; color: #bdc3c7; margin-top: 4px; }
        .item-action a { padding: 8px 16px; background: #e67e22; color: #fff; border-radius: 4px; text-decoration: none; font-size: 13px; white-space: nowrap; }
        .item-action a:hover { background: #ca6f1e; }

        .empty { background: #fff; padding: 60px 20px; border-radius: 8px; text-align: center; color: #7f8c8d; box-shadow: 0 2px 6px rgba(0,0,0,.06); }
        .empty a { color: #e74c3c; text-decoration: none; font-weight: bold; }

        .footer { text-align: center; padding: 24px; color: #95a5a6; font-size: 13px; margin-top: 40px; }
    </style>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <div class="header-bar">
        <h1>🕘 <span th:text="${currentUsername}">用户</span> 的阅读历史
            <span class="count" th:text="'共 ' + ${#lists.size(items)} + ' 条'">共 0 条</span>
        </h1>
    </div>

    <div th:if="${#lists.isEmpty(items)}" class="empty">
        <p style="font-size: 18px; margin-bottom: 12px;">还没有阅读记录</p>
        <p>去 <a th:href="@{/}">首页</a> 挑一本书开始阅读吧!</p>
    </div>

    <div class="list" th:if="${!#lists.isEmpty(items)}">
        <div class="item" th:each="it : ${items}">
            <img class="item-cover"
                 th:src="${it.novelCover != null and it.novelCover != ''} ? ${it.novelCover} : 'https://placehold.co/56x76/95a5a6/ffffff?text=N'"
                 th:alt="${it.novelTitle}">
            <div class="item-main">
                <div class="item-title">
                    <a th:href="@{/novels/{id}(id=${it.novelId})}" th:text="${it.novelTitle}">书名</a>
                </div>
                <div class="item-meta">
                    读到 <span class="chapter" th:text="'第 ' + ${it.chapterNo} + ' 章'">第 1 章</span>
                    · 共 <span th:text="${it.chapterTotal}">0</span> 章
                </div>
                <div class="item-time" th:if="${it.updatedAt != null}"
                     th:text="'最近阅读: ' + ${#temporals.format(it.updatedAt, 'yyyy-MM-dd HH:mm')}">最近阅读</div>
            </div>
            <div class="item-action">
                <a th:href="@{/novels/{id}/chapters/{no}(id=${it.novelId},no=${it.chapterNo})}">▶ 继续阅读</a>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
